# Include this file from Nginx's http context (for example conf.d/).
map $uri $dash_resource_policy {
	default same-origin;
	/directory-entry.json cross-origin;
}
map $uri $dash_allow_origin {
	default "";
	/directory-entry.json "*";
}

server {
	listen 443 ssl http2;
	server_name dune.example.com;

	root /srv/dash-public-site;
	index index.html;

	add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; style-src 'self'; script-src 'self'; connect-src 'self' https:; img-src 'self' data:" always;
	add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy $dash_resource_policy always;
	add_header Access-Control-Allow-Origin $dash_allow_origin always;
	add_header Referrer-Policy "no-referrer" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header X-Permitted-Cross-Domain-Policies "none" always;
	add_header Cache-Control "no-store, max-age=0, must-revalidate, no-transform" always;
	add_header Pragma "no-cache" always;
	add_header Expires "0" always;

	if ($request_method !~ ^(GET|HEAD)$) {
		return 404;
	}

	location = / {
		try_files /index.html =404;
	}

	location = /directory-entry.json {
		try_files $uri =404;
	}

	location = /directory { return 308 /directory/; }
	location = /directory/ { try_files /directory/index.html =404; }
	location ~ ^/directory/(index\.html|directory\.css|directory\.js|directory\.json)$ {
		try_files $uri =404;
	}

	location ~ ^/[^/]+\.(html|css|js|json|svg|webp)$ {
		try_files $uri =404;
	}

	location / {
		return 404;
	}
}
