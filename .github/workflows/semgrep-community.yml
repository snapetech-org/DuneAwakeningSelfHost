# ng-runner-policy: private-jit-only-v1
name: Semgrep Community Edition

run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:

    inputs:
      action:
        description: Run the private security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]
permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-ce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep CE (community rules)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-duneawakeningselfhost","ng-main-run-{0}","gha-{0}-semgrep"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e EIO_BACKEND=posix \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Review semgrep.sarif and the scan log."' semgrep.json

      - name: Upload findings to GitHub code scanning
        if: >-
          always() && hashFiles('semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-ce-community
