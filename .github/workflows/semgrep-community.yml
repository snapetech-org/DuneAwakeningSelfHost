# ng-runner-policy: private-jit-only-v1
name: Semgrep Community Edition

on:
  push:
  pull_request:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-ce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep CE (community rules)
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-duneawakeningselfhost","ng-main-run-{0}","gha-{0}-semgrep"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e EIO_BACKEND=posix \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Review the job log and JSON report."' semgrep.json

      - name: Retain Semgrep scan reports
        if: always() && (hashFiles('semgrep.json') != '' || hashFiles('semgrep.sarif') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-community-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: warn
          retention-days: 14
