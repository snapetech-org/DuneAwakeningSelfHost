# ng-runner-policy: private-jit-only-v1
name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-duneawakeningselfhost","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-psycopg2
          sudo install -m 0755 public-site/scripts/render-dune-static-status.sh /usr/local/sbin/render-dune-static-status.sh

      - name: Validate repository
        run: make validate

      - name: Block runtime artifacts
        run: |
          test ! -e .env
          ! git ls-files data | grep -v '^data/exchange-price-snapshots/'
          test ! -e config/tls
