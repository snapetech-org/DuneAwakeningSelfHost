# ng-runner-policy: private-jit-only-v1
name: Validate


run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'ci', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:
  pull_request:
    types: [labeled]
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Required workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

jobs:
  validate:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.action == 'ci' &&
        inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-duneawakeningselfhost","ng-main-run-{0}","gha-{0}-validate"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-psycopg2
          sudo install -m 0755 public-site/scripts/render-dune-static-status.sh /usr/local/sbin/render-dune-static-status.sh

      - name: Validate repository
        run: make validate

      - name: Block runtime artifacts
        run: |
          test ! -e .env
          ! git ls-files data | grep -v '^data/exchange-price-snapshots/'
          test ! -e config/tls
