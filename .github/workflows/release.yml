# ng-runner-policy: private-jit-only-v1
name: Release


run-name: >-
  ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Release action
        type: choice
        options: [release]
        required: true
      runner_pool:
        description: Private ephemeral JIT runner pool
        type: choice
        options: [private]
        required: true
      release_tag:
        description: Exact existing version tag to build and publish
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'snapetech/DuneAwakeningSelfHost' && github.ref == 'refs/heads/main' && github.actor == 'snapetech' && inputs.action == 'release' && inputs.runner_pool == 'private' && inputs.release_tag != ''
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-duneawakeningselfhost","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate tag identity
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '\r\n' < VERSION)"
          test "$RELEASE_TAG" = "$expected"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install validation and cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates clang cmake curl jq lld mingw-w64 \
            ninja-build python3-psycopg2 ripgrep
          sudo install -m 0755 public-site/scripts/render-dune-static-status.sh /usr/local/sbin/render-dune-static-status.sh

      - name: Validate the complete repository
        run: make validate

      - name: Build and smoke-test release assets
        run: scripts/build-release-assets.sh --version "$RELEASE_TAG" --ref "$(git rev-parse HEAD)"

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: "dist/release/*"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-github-release.sh "$RELEASE_TAG" dist/release "$GITHUB_REPOSITORY"
